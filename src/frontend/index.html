<!DOCTYPE html>
<!--
  SECTION 1: Document type
  Declares this as an HTML5 document
-->
<html>

  <head>
    <!--
      SECTION 2: Page title
      Appears in the browser tab
    -->
    <title>FYP Simple Frontend</title>
  </head>

  <body>
    <!--
      SECTION 3: Page heading
      Confirms the frontend page has loaded
    -->
    <h1>Frontend Test Page</h1>

    <!--
      SECTION 4: Explanation text
      Describes what the buttons do
    -->
    <p>
      The buttons below send HTTP GET requests to the backend API
      hosted on ECS behind the Application Load Balancer.
      Each response opens in a new browser tab.
    </p>

    <!--
      SECTION 5: Health check link
      Calls the backend /health endpoint via the ALB
    -->
    <a href="http://fyp-secure-pipeline-alb-327820474.eu-west-2.elb.amazonaws.com/health" target="_blank">
      <button type="button">Check Backend Health</button>
    </a>

    <br /><br />

    <!--
      SECTION 6: API message link
      Calls the backend /api/message endpoint via the ALB
    -->
    <a href="http://fyp-secure-pipeline-alb-327820474.eu-west-2.elb.amazonaws.com/api/message" target="_blank">
      <button type="button">Call Backend API</button>
    </a>

  </body>
</html>
