name: CI (Secure Pipeline)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  terraform-validate:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialise Terraform (no backend)
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        run: terraform validate


  tfsec-scan:
    name: tfsec IaC Scan
    runs-on: ubuntu-latest
    needs: terraform-validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tfsec
        run: |
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Run tfsec
        run: tfsec ./infra


  checkov-scan:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    needs: terraform-validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          soft_fail: false
          skip_check: CKV_AWS_2,CKV_AWS_150,CKV_AWS_91,CKV_AWS_382,CKV_AWS_260,CKV_AWS_130,CKV_AWS_51


  docker-build-and-trivy:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t fyp-app:ci -f src/backend/Dockerfile src/backend

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "fyp-app:ci"
          format: "table"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"
          exit-code: "1"